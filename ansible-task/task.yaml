---
- hosts: localhost
  connection: local
  tasks:
  - name: start an instance with a public IP address
    amazon.aws.ec2_instance:
     name: "EC2 inst"
     vpc_subnet_id: subnet-value
     instance_type: t3.small
     security_group: default
     region: us-east-1
     network_interfaces:
      - assign_public_ip: true
     image_id: "{{ item.image }}"
     aws_access_key: "some-value"
     aws_secret_key: "some-value"
     tags:
      Environment: Testing
    loop:
      - { image: "ami-0b6d9d3d33ba97d99" } 
      - { image: "ami-0b75f821522bcff85" }
      - { image: "ami-0b75f821522bcff85" }